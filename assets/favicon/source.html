<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&display=swap" rel="stylesheet">
<style>
  @page { size: 512px 512px; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 512px; height: 512px; background: transparent; }
  /* Editorial Minimal mark: oxblood ground, warm-paper serif "DC." */
  .square {
    width: 512px; height: 512px;
    background: linear-gradient(150deg, #9b3d2e 0%, #88331f 55%, #722a19 100%);
    border-radius: 96px;
    position: relative;
    overflow: hidden;
    font-family: 'Fraunces', Georgia, serif;
  }
  /* warm paper edge accent — echoes the site's left rule */
  .accent {
    position: absolute;
    left: 0; top: 0;
    width: 30px; height: 100%;
    background: #faf8f5;
    opacity: 0.92;
  }
  .glow {
    position: absolute;
    top: -25%; right: -20%;
    width: 75%; height: 75%;
    background: radial-gradient(circle, rgba(250,248,245,0.16), transparent 62%);
  }
  .mono {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #faf8f5;
    font-weight: 900;
    font-size: 250px;
    letter-spacing: -8px;
    line-height: 1;
    padding-left: 26px;
  }
  .dot { color: #f0c5a0; }
</style>
</head><body>
<div class="square">
  <div class="accent"></div>
  <div class="glow"></div>
  <div class="mono">DC<span class="dot">.</span></div>
</div>
</body></html>
