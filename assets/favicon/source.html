<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
  @page { size: 512px 512px; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 512px; height: 512px; background: transparent; }
  .square {
    width: 512px; height: 512px;
    background: linear-gradient(135deg, #0f1419 0%, #161b22 50%, #1a1f2e 100%);
    border-radius: 96px;
    position: relative;
    overflow: hidden;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }
  .accent {
    position: absolute;
    left: 0; top: 0;
    width: 36px; height: 100%;
    background: linear-gradient(180deg, #e34a33 0%, #f3a953 50%, #3a7d99 100%);
  }
  .glow1 {
    position: absolute;
    top: -20%; right: -20%;
    width: 70%; height: 70%;
    background: radial-gradient(circle, rgba(243,169,83,0.30), transparent 60%);
  }
  .glow2 {
    position: absolute;
    bottom: -20%; left: 10%;
    width: 70%; height: 70%;
    background: radial-gradient(circle, rgba(58,125,153,0.25), transparent 60%);
  }
  .mono {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-weight: 800;
    font-size: 280px;
    letter-spacing: -10px;
    line-height: 1;
    padding-left: 30px;
  }
  .dot {
    color: #f3a953;
  }
</style>
</head><body>
<div class="square">
  <div class="accent"></div>
  <div class="glow1"></div>
  <div class="glow2"></div>
  <div class="mono">DC<span class="dot">.</span></div>
</div>
</body></html>
