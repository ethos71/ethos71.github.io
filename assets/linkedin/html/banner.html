<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dominick Campbell — LinkedIn Banner</title>
<style>
  @page { size: 1584px 396px; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    width: 1584px;
    height: 396px;
    background: #0f1419;
    color: #ffffff;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    overflow: hidden;
  }

  .frame {
    width: 1584px;
    height: 396px;
    position: relative;
    background:
      radial-gradient(ellipse at 95% 50%, rgba(227, 74, 51, 0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 5% 50%, rgba(58, 125, 153, 0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 100%, rgba(243, 169, 83, 0.10) 0%, transparent 60%),
      linear-gradient(135deg, #0f1419 0%, #161b22 50%, #1a1f2e 100%);
    overflow: hidden;
  }

  /* Subtle grid pattern */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    background-position: 0 0;
    opacity: 0.6;
  }

  /* Left accent bar */
  .left-bar {
    position: absolute;
    left: 0;
    top: 0;
    width: 8px;
    height: 100%;
    background: linear-gradient(180deg, #e34a33 0%, #f3a953 50%, #3a7d99 100%);
  }

  /* Reserved zone for profile pic (bottom-left) — leave empty */
  /* LinkedIn profile pic sits roughly at x=80, y=240, ~160x160 */

  /* Main content sits to the right of the profile pic zone */
  .content {
    position: absolute;
    left: 280px;
    top: 70px;
    right: 90px;
    bottom: 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 60px;
  }

  .text-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .kicker {
    font-size: 14px;
    color: #f3a953;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 4px;
    margin-bottom: 12px;
  }

  .name {
    font-size: 56px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.0;
    letter-spacing: -1.5px;
    margin-bottom: 14px;
  }

  .title {
    font-size: 22px;
    font-weight: 500;
    color: #c8d0d8;
    letter-spacing: 0.3px;
    margin-bottom: 22px;
  }

  .credentials {
    display: flex;
    gap: 28px;
    align-items: center;
  }

  .cred-item {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    border-left: 3px solid;
    padding-left: 14px;
  }

  .cred-item.r1 { border-left-color: #e34a33; }
  .cred-item.r2 { border-left-color: #3a7d99; }
  .cred-item.r3 { border-left-color: #2b8c5d; }
  .cred-item.r4 { border-left-color: #f3a953; }

  .cred-value {
    font-size: 28px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.0;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }

  .cred-label {
    font-size: 12px;
    color: #8a9199;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  /* Right side — case study series indicator */
  .series-block {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    min-width: 360px;
  }

  .series-label {
    font-size: 12px;
    color: #8a9199;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 14px;
  }

  .series-title {
    font-size: 26px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.1;
    margin-bottom: 18px;
    text-align: right;
  }

  .series-pills {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }

  .pill {
    width: 50px;
    height: 6px;
    border-radius: 4px;
  }
  .pill.r { background: #e34a33; }
  .pill.t { background: #3a7d99; }
  .pill.n { background: #1f6f8b; }
  .pill.p { background: #5d3a9b; }
  .pill.g { background: #2b8c5d; }

  .series-meta {
    font-size: 13px;
    color: #b0b8bf;
    font-weight: 500;
    text-align: right;
    line-height: 1.4;
  }

  .series-meta .url {
    color: #f3a953;
    font-weight: 700;
    display: block;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="grid-overlay"></div>
  <div class="left-bar"></div>

  <div class="content">

    <div class="text-block">
      <div class="kicker">Principal Engineer · AI Architect</div>
      <div class="name">Dominick A. Campbell</div>
      <div class="title">Building production AI &amp; backend systems for 25+ years</div>

      <div class="credentials">
        <div class="cred-item r1">
          <div class="cred-value">4</div>
          <div class="cred-label">Patents Pending</div>
        </div>
        <div class="cred-item r2">
          <div class="cred-value">100M+</div>
          <div class="cred-label">Daily Transactions</div>
        </div>
        <div class="cred-item r3">
          <div class="cred-value">10M+</div>
          <div class="cred-label">Users Authenticated</div>
        </div>
        <div class="cred-item r4">
          <div class="cred-value">5</div>
          <div class="cred-label">Production Systems</div>
        </div>
      </div>
    </div>

    <div class="series-block">
      <div class="series-label">Now Reading</div>
      <div class="series-title">Five Systems<br>I Shipped</div>
      <div class="series-pills">
        <div class="pill r"></div>
        <div class="pill t"></div>
        <div class="pill n"></div>
        <div class="pill p"></div>
        <div class="pill g"></div>
      </div>
      <div class="series-meta">
        Production case studies
        <span class="url">ethos71.github.io/blog</span>
      </div>
    </div>

  </div>

</div>
</body>
</html>
