{% comment %}

    - favicon set (generated from /assets/favicon/source.html)
    - apple touch icon
    - web app manifest
    - theme color
{% endcomment %}

<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon/favicon-16x16.png' | relative_url }}">
